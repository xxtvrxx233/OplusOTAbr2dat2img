name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    # 推 tag 时要把产物附到 Release，需要写权限；fork 来的 PR 拿到的 token 仍是只读
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # 在 manylinux2014 容器里编译：glibc 2.17 起，覆盖 2014 年后的绝大多数发行版。
      # 直接在 ubuntu-latest 上编会把 glibc 下限抬到 runner 的版本，老系统跑不了。
      - name: Build
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e OUTDIR=/src/dist \
            quay.io/pypa/manylinux2014_x86_64 \
            bash /src/.github/scripts/build-linux.sh

      - name: Smoke test
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet brotli
          bash .github/scripts/smoke-test.sh dist/br2dat2img "$RUNNER_TEMP/venv/bin/python"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: br2dat2img-linux-x86_64
          path: dist/br2dat2img
          if-no-files-found: error

      # 推 tag 时附到 Release 上，方便直接下载
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/br2dat2img
