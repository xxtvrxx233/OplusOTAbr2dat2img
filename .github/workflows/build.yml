name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    # 推 tag 时要把产物附到 Release，需要写权限；fork 来的 PR 拿到的 token 仍是只读
    permissions:
      contents: write
    # 用官方 python 镜像而不是 ubuntu-latest 直接编：
    #   - ubuntu-latest 的 glibc 太新（2.39），产物在老系统上跑不了；
    #     bookworm 是 2.36，覆盖范围更广
    #   - 该镜像的 CPython 是 --enable-shared 编的，PyInstaller 需要 libpython3.x.so
    #     （manylinux 镜像是 --disable-shared，用不了）
    #   - 用完整版而非 slim：slim 里没有 git，actions/checkout 需要它
    container:
      image: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          bash .github/scripts/build-linux.sh
          ls -l dist/

      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh dist/br2dat2img python3

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: br2dat2img-linux-x86_64
          path: dist/br2dat2img
          if-no-files-found: error

      # 推 tag 时附到 Release 上，方便直接下载
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/br2dat2img

  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    # 不发布 Release：产物只作为 artifact 上传，由维护者自行验证后手动发布。
    # 原因是 Windows 产物无法在本仓库的 Linux 环境下实测，必须先人工确认。
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: pwsh
        run: |
          ./.github/scripts/build-windows.ps1
          Get-ChildItem dist

      # windows-latest 自带 Git Bash，冒烟测试脚本可直接跑
      - name: Smoke test
        shell: bash
        run: bash .github/scripts/smoke-test.sh dist/br2dat2img.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: br2dat2img-windows-x86_64
          path: dist/br2dat2img.exe
          if-no-files-found: error
